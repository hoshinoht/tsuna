[package]
name = "tsuna-supervisor"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
publish = false
description = "Experiment-local process supervisor adapted from Tsuna's native/tsuna/src/jobs.rs (92c4728)."

[dependencies]
anyhow = "1.0.104"
libc = "0.2.190"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
