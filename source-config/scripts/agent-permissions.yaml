# Source of truth for agent permission rules. Regenerate agent frontmatter with:
#   bun scripts/gen-agent-permissions.ts
# Rules are [action, resource, effect]; "@name" splices a fragment in place.
# OpenCode evaluates rules last-match-wins, so order matters.
fragments:
  core-read:
    - [read, "*", allow]
    - [glob, "*", allow]
    - [grep, "*", allow]
    - [skill, "*", allow]
  web:
    - [webfetch, "*", allow]
    - [websearch, "*", allow]
    - [gofetch_*, "*", allow]
    - [context7_*, "*", allow]
  workplan-read:
    - [workplan_read, "*", allow]
    - [workplan_list, "*", allow]
    - [workplan_inspect, "*", allow]
    - [workplan_validate, "*", allow]
    - [workplan_resume, "*", allow]
  shell-guard:
    - [shell, git push*, ask]
    - [shell, git reset --hard*, ask]
    - [shell, git clean*, ask]
    - [shell, rm -rf*, ask]
  implement:
    - [edit, "*", allow]
    - [shell, "*", allow]
    - "@shell-guard"
  workplan-write-deny:
    - [workplan_create, "*", deny]
    - [workplan_update, "*", deny]
    - [workplan_patch, "*", deny]
    - [workplan_reset, "*", deny]
    - [workplan_checkpoint, "*", deny]
    - [workplan_compact, "*", deny]
  external-dirs:
    - [external_directory, "*", ask]
    - [external_directory, ~/.config/opencode/skills/*, allow]
    - [external_directory, ~/.local/share/opencode/tool-output/*, allow]
  env-guard:
    - [read, "*.env", ask]
    - [read, "*.env.*", ask]
    - [read, "*.env.example", allow]
agents:
  ats-tailor:
    - ["*", "*", deny]
    - [question, "*", allow]
    - [gofetch_*, "*", allow]
    - [ats-tailor_*, "*", allow]
    - [ats-tailor_ats_add_jd, "*", ask]
    - [ats-tailor_ats_set_requirements, "*", ask]
    - [ats-tailor_ats_tailor, "*", ask]
    - [ats-tailor_ats_override, "*", ask]
    - [ats-tailor_ats_compile, "*", ask]
    - [ats-tailor_ats_check, "*", ask]
    - [ats-tailor_ats_index_put, "*", ask]
    - [ats-tailor_ats_outcome, "*", ask]
    - [ats-tailor_ats_accept_proposal, "*", ask]
    - [ats-tailor_ats_reject_proposal, "*", ask]
  build:
    - ["*", "*", ask]
    - [docs_*, "*", deny]  # report tooling: document-writer and scholar only; keeps ~4.7 KB out of the catalog
    - "@core-read"
    - [question, "*", allow]
    - "@web"
    - [lsp-tools_*, "*", allow]
    - "@implement"
    - [subagent, "*", deny]
    - [subagent, explore, allow]
    - [subagent, researcher, allow]
    - [subagent, plan, allow]
    - [subagent, plan-checker, allow]
    - [subagent, code-writer, allow]
    - [subagent, code-engineer, allow]
    - [subagent, frontend-engineer, allow]
    - [subagent, fidelity, allow]  # repo-local project agent (.opencode/agents/fidelity.md)
    - [subagent, tester, allow]
    - [subagent, code-checker, allow]
    - [subagent, oracle, allow]
    - [subagent, document-writer, allow]
    - [subagent, document-proofreader, allow]
    - [subagent, experimenter, allow]
    - [subagent_list, "*", allow]
    - [subagent_stop, "*", allow]  # the tool itself refuses sessions that are not the caller's children
    - [compress, "*", allow]  # DCP context compression (primary sessions only)
    - "@workplan-write-deny"
    - "@external-dirs"
    - "@env-guard"
  code-checker:
    - ["*", "*", deny]
    - "@core-read"
    - [question, "*", deny]
    - "@web"
    - [lsp-tools_*, "*", allow]  # diagnostics and references while reviewing
    - "@workplan-read"
    - [shell, git status --short, allow]
    - [shell, git status --porcelain*, allow]
    - [shell, git --no-pager status --short, allow]
    - [shell, git --no-pager status --porcelain*, allow]
    - [shell, git diff --no-ext-diff --no-textconv*, allow]
    - [shell, git --no-pager diff --no-ext-diff --no-textconv*, allow]
    - [external_directory, "*", ask]
    - [external_directory, /private/var/folders/*/T/opencode/*.diff, allow]
    - "@env-guard"
  code-engineer:
    - ["*", "*", deny]  # deny by default: every tool not allowed here stays out of the request
    - "@core-read"
    - [question, "*", deny]
    - "@web"
    - [lsp-tools_*, "*", allow]
    - "@workplan-read"
    - "@implement"
    - [subagent, "*", deny]
    - "@workplan-write-deny"
    - "@external-dirs"
    - "@env-guard"
  code-writer:
    - ["*", "*", deny]  # deny by default: every tool not allowed here stays out of the request
    - "@core-read"
    - [question, "*", deny]
    - "@web"
    - [lsp-tools_*, "*", allow]
    - "@workplan-read"
    - "@implement"
    - [subagent, "*", deny]
    - "@workplan-write-deny"
    - "@external-dirs"
    - "@env-guard"
  document-proofreader:
    - ["*", "*", deny]
    - "@core-read"
    - [question, "*", deny]
    - "@web"
    - "@workplan-read"
    - "@external-dirs"
    - "@env-guard"
  document-writer:
    - ["*", "*", ask]
    - [subagent_list, "*", deny]
    - [subagent_stop, "*", deny]
    - "@core-read"
    - [question, "*", deny]
    - "@web"
    - "@workplan-read"
    - "@implement"
    - [subagent, "*", deny]
    - "@workplan-write-deny"
    - [docs_*, "*", allow]
    - "@external-dirs"
    - "@env-guard"
