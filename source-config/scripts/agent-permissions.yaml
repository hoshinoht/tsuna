    - "@web"
    - [lsp-tools_*, "*", allow]
    - [workplan_read, "*", allow]
    - [workplan_resume, "*", allow]
    - [workplan_list, "*", allow]
    - [workplan_inspect, "*", allow]
    - [workplan_validate, "*", allow]
    - [workplan_doctor, "*", allow]
    - [workplan_compact_preview, "*", allow]
    - [opencode_list_mcp_resources, "*", allow]
    - "@implement"
    - [subagent, "*", deny]
    - [workplan_create, "*", allow]
    - [workplan_update, "*", allow]
    - [workplan_checkpoint, "*", allow]
    - [workplan_compact, "*", ask]
    - [workplan_patch, "*", allow]
    - [workplan_reset, "*", ask]  # wipe mode can clear a plan; the user approves every reset
    - [subagent, plan, allow]
    - [subagent, explore, allow]
    - [subagent, researcher, allow]
    - [subagent, plan-checker, allow]
    - [subagent, code-writer, allow]
