[package]
name = "tsuna"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
libc = "0.2.190"
rand = "0.9.5"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde-saphyr = "1.3.0"

[dev-dependencies]
tempfile = "3.27.0"
